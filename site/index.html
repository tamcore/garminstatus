<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Garmin Status — unofficial uptime history</title>
  <meta name="description" content="Unofficial Garmin Connect status page with 180 days of uptime history." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E" />
  <script>
    // Apply the saved theme before first paint to avoid a flash. No stored
    // value (or "auto") leaves the attribute unset so prefers-color-scheme wins.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <header class="masthead">
    <div class="masthead__inner">
      <div class="brand">
        <span class="brand__dot" id="brandDot"></span>
        <span class="brand__name">GARMIN&nbsp;STATUS</span>
        <span class="brand__tag">unofficial</span>
      </div>
      <div class="masthead__right">
        <span class="masthead__meta" id="lastChecked">—</span>
        <div class="theme-toggle" id="themeToggle" role="group" aria-label="Theme">
          <button type="button" data-mode="auto" title="Follow system theme">Auto</button>
          <button type="button" data-mode="light" title="Light theme">Light</button>
          <button type="button" data-mode="dark" title="Dark theme">Dark</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap" id="app" aria-live="polite">
    <section class="hero" id="hero">
      <div class="hero__pulse" id="heroPulse"></div>
      <div class="hero__text">
        <h1 class="hero__headline" id="heroHeadline">Loading status…</h1>
        <p class="hero__sub" id="heroSub">Fetching the last 180 days of uptime history.</p>
      </div>
    </section>

    <section class="summary" id="summary" hidden></section>

    <div id="sections"></div>

    <section class="incidents" id="incidentsSection" hidden>
      <h2 class="section__title">Recent incidents</h2>
      <ol class="incident-list" id="incidentList"></ol>
    </section>
  </main>

  <footer class="foot">
    <p>
      Not affiliated with Garmin. Data is scraped from Garmin's public status page and
      aggregated automatically. Uptime is reconstructed from recorded status transitions.
    </p>
    <p class="foot__span" id="footSpan"></p>
  </footer>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <script src="app.js"></script>
</body>
</html>
