name: collect

# Poll Garmin's public status page and record a change-log entry only when the
# status changed (or a heartbeat is due). GitHub cron is best-effort and the
# minimum interval is 5 minutes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      heartbeat:
        description: 'Force a record after this long with no status change (e.g. 3h, 1s)'
        required: false
        default: '3h'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Record snapshot
        run: go run . snapshot --heartbeat "${{ github.event.inputs.heartbeat || '3h' }}"

      - name: Rebuild status data (only if the change-log changed)
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            go run . build
          else
            echo "no change-log update; skipping build"
          fi

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain data/ site/data/)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/
          git commit -m "chore(data): update status snapshot [skip ci]"
          git push
