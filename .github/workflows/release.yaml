name: release

on:
  push:
    tags:
      - v*

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4.1.0
        with:
          go-version: 1.21.6

      - uses: ko-build/setup-ko@v0.6

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
